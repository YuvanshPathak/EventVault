spring:
  application:
    name: eventvault
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:eventvault}
    username: ${DB_USER:eventvault}
    password: ${DB_PASSWORD:eventvault}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-change-it-before-any-real-deployment}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

server:
  port: ${PORT:8080}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:info}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:eventvault;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
